{% macro financeiro_tabs(active) -%}
<ul class="nav nav-pills detail-tabs financeiro-tabs" role="tablist">
    <li class="nav-item" role="presentation">
        <a class="nav-link {{ 'active' if active == 'visao_geral' else '' }}" href="{{ url_for('financeiro') }}">Visao geral</a>
    </li>
    <li class="nav-item" role="presentation">
        <a class="nav-link {{ 'active' if active == 'despesas' else '' }}" href="{{ url_for('financeiro_despesas') }}">Despesas</a>
    </li>
    {% if can_manage_despesas() %}
        <li class="nav-item" role="presentation">
            <a class="nav-link {{ 'active' if active == 'cobrancas' else '' }}" href="{{ url_for('financeiro_cobrancas') }}">Cobrancas</a>
        </li>
        <li class="nav-item" role="presentation">
            <a class="nav-link {{ 'active' if active == 'reembolsos' else '' }}" href="{{ url_for('financeiro_reembolsos') }}">Reembolsos</a>
        </li>
    {% endif %}
</ul>
{%- endmacro %}
